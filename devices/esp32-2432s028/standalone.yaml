# =============================================================================
# ESP32-2432S028 — Now-Playing Display (no LVGL)
# =============================================================================
# Album artwork background with song title and artist overlay.
# Uses display lambdas + online_image for minimal RAM usage on no-PSRAM ESP32.
# =============================================================================

substitutions:
  name: "music-dashboard"
  friendly_name: "Music Dashboard"
  media_entity: "media_player.wiim_ma900"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

logger:
  hardware_uart: UART0

api:
  on_client_connected:
    - lambda: |-
        if (client_info.find("Home Assistant") != std::string::npos) {
          id(ha_base_url) = "http://" + client_address + ":8123";
        }

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

http_request:
  verify_ssl: false


# -----------------------------------------------------------------------------
# HARDWARE
# -----------------------------------------------------------------------------
spi:
  - id: display_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO21
    frequency: 150Hz

light:
  - platform: monochromatic
    id: backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

display:
  - platform: mipi_spi
    model: ILI9342
    id: my_display
    spi_id: display_spi
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    reset_pin: GPIO0
    color_order: BGR
    invert_colors: false
    dimensions:
      height: 240
      width: 320
    update_interval: 1s
    pages:
      - id: now_playing
        lambda: |-
          auto BLACK = Color(0, 0, 0);
          auto WHITE = Color(255, 255, 255);
          auto GREY  = Color(160, 160, 160);
          auto DIM   = Color(100, 100, 100);
          auto ACCENT = Color(255, 180, 0);

          it.fill(BLACK);

          // Album art centered
          if (id(art_loaded)) {
            it.image(80, 20, id(album_art));
          }

          // Title
          std::string title = id(media_title).state;
          if (title.empty()) title = "\xe2\x80\x94";
          it.printf(12, 12, id(font_title), WHITE, TextAlign::TOP_LEFT, "%s", title.c_str());

          // Artist
          if (!id(media_artist).state.empty()) {
            it.printf(12, 48, id(font_artist), GREY, TextAlign::TOP_LEFT, "%s", id(media_artist).state.c_str());
          }

          // Time and progress bar
          if (!isnan(id(media_position).state) && !isnan(id(media_duration).state) && id(media_duration).state > 0) {
            float pos = id(media_position).state;
            float dur = id(media_duration).state;
            float pct = pos / dur;
            if (pct < 0) pct = 0;
            if (pct > 1) pct = 1;

            // Progress bar at bottom
            it.filled_rectangle(0, 236, 320, 4, Color(40, 40, 40));
            it.filled_rectangle(0, 236, (int)(320 * pct), 4, WHITE);

            // Time text
            int pm = (int)pos / 60, ps = (int)pos % 60;
            int dm = (int)dur / 60, ds = (int)dur % 60;
            it.printf(12, 220, id(font_time), DIM, TextAlign::TOP_LEFT, "%d:%02d / %d:%02d", pm, ps, dm, ds);
          }

          // Play state indicator
          std::string state = id(media_state).state;
          if (state == "playing") {
            it.printf(290, 200, id(font_state), ACCENT, TextAlign::TOP_LEFT, "||");
          } else if (state == "paused") {
            it.printf(290, 200, id(font_state), ACCENT, TextAlign::TOP_LEFT, ">");
          }

touchscreen:
  - platform: xpt2046
    id: tft_touch
    display: my_display
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    threshold: 400
    calibration:
      x_min: 280
      x_max: 3850
      y_min: 340
      y_max: 3850
    on_touch:
      - lambda: |-
          id(touch_x_start) = touch.x;
          id(touch_y_start) = touch.y;
    on_update:
      - lambda: |-
          for (auto touch: touches) {
            if (touch.state <= 2) {
              id(touch_x_end) = touch.x;
              id(touch_y_end) = touch.y;
            }
          }
    on_release:
      - lambda: |-
          int dx = id(touch_x_end) - id(touch_x_start);
          int dy = id(touch_y_end) - id(touch_y_start);
          if (abs(dx) < 20 && abs(dy) < 20) {
            id(do_play_pause).execute();
          } else if (dx < -50 && abs(dx) > abs(dy) * 2) {
            id(do_next_track).execute();
          } else if (dx > 50 && abs(dx) > abs(dy) * 2) {
            id(do_prev_track).execute();
          }


# -----------------------------------------------------------------------------
# GLOBALS
# -----------------------------------------------------------------------------
globals:
  - id: ha_base_url
    type: std::string
    initial_value: '"http://homeassistant.local:8123"'
  - id: art_loaded
    type: bool
    initial_value: 'false'
  - id: last_art_url
    type: std::string
    initial_value: '""'
  - id: touch_x_start
    type: int
    initial_value: '0'
  - id: touch_y_start
    type: int
    initial_value: '0'
  - id: touch_x_end
    type: int
    initial_value: '0'
  - id: touch_y_end
    type: int
    initial_value: '0'


# -----------------------------------------------------------------------------
# HA SENSORS
# -----------------------------------------------------------------------------
text_sensor:
  - platform: homeassistant
    entity_id: ${media_entity}
    attribute: media_title
    id: media_title
    internal: true

  - platform: homeassistant
    entity_id: ${media_entity}
    attribute: media_artist
    id: media_artist
    internal: true

  - platform: homeassistant
    entity_id: ${media_entity}
    id: media_state
    internal: true

  - platform: homeassistant
    entity_id: ${media_entity}
    attribute: entity_picture
    id: media_picture
    internal: true
    on_value:
      then:
        - lambda: |-
            if (x.empty()) {
              id(art_loaded) = false;
              id(last_art_url) = "";
              return;
            }
            // Skip if same artwork
            if (x == id(last_art_url)) return;
            id(last_art_url) = x;
            id(art_loaded) = false;
        # Give HA automation time to resize the image
        - delay: 2s
        - lambda: |-
            std::string url = id(ha_base_url) + "/local/album_art.jpg";
            id(album_art).set_url(url.c_str());
            id(album_art).update();

sensor:
  - platform: homeassistant
    entity_id: ${media_entity}
    attribute: media_duration
    id: media_duration
    internal: true

  - platform: homeassistant
    entity_id: ${media_entity}
    attribute: media_position
    id: media_position
    internal: true


# -----------------------------------------------------------------------------
# SCRIPTS
# -----------------------------------------------------------------------------
script:
  - id: do_play_pause
    mode: single
    then:
      - homeassistant.service:
          service: media_player.media_play_pause
          data:
            entity_id: ${media_entity}
  - id: do_next_track
    mode: single
    then:
      - homeassistant.service:
          service: media_player.media_next_track
          data:
            entity_id: ${media_entity}
  - id: do_prev_track
    mode: single
    then:
      - homeassistant.service:
          service: media_player.media_previous_track
          data:
            entity_id: ${media_entity}


# -----------------------------------------------------------------------------
# ALBUM ART (fetches pre-resized baseline JPEG from HA /local/album_art.jpg)
# -----------------------------------------------------------------------------
online_image:
  - url: "http://placeholder.invalid/placeholder.jpg"
    id: album_art
    format: jpeg
    type: RGB565
    update_interval: never
    byte_order: big_endian
    on_download_finished:
      then:
        - lambda: 'id(art_loaded) = true;'
        - component.update: my_display
    on_error:
      then:
        - lambda: 'id(art_loaded) = false;'
        - component.update: my_display


