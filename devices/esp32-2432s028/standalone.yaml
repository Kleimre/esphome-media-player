# =============================================================================
# ESP32-2432S028 — Now-Playing Display (minimal LVGL)
# =============================================================================
# Album artwork background with song title and artist overlay.
# Uses LVGL with 10% partial buffer (15KB) instead of display lambdas
# (153KB full framebuffer), freeing ~138KB for larger artwork.
# =============================================================================

substitutions:
  name: "music-dashboard"
  friendly_name: "Music Dashboard"
  media_entity: "media_player.wiim_ma900"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

logger:
  hardware_uart: UART0

api:
  on_client_connected:
    - lambda: |-
        if (client_info.find("Home Assistant") != std::string::npos) {
          id(ha_base_url) = "http://" + client_address + ":8123";
        }

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

http_request:
  verify_ssl: false


# -----------------------------------------------------------------------------
# HARDWARE
# -----------------------------------------------------------------------------
spi:
  - id: display_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO21
    frequency: 150Hz

light:
  - platform: monochromatic
    id: backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

display:
  - platform: mipi_spi
    model: ILI9341
    id: my_display
    spi_id: display_spi
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    reset_pin: GPIO0
    color_order: RGB
    invert_colors: false
    dimensions:
      height: 240
      width: 320
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: tft_touch
    display: my_display
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    threshold: 400
    calibration:
      x_min: 280
      x_max: 3850
      y_min: 340
      y_max: 3850
    on_touch:
      - lambda: |-
          id(touch_x_start) = touch.x;
          id(touch_y_start) = touch.y;
    on_update:
      - lambda: |-
          for (auto touch: touches) {
            if (touch.state <= 2) {
              id(touch_x_end) = touch.x;
              id(touch_y_end) = touch.y;
            }
          }
    on_release:
      - lambda: |-
          int dx = id(touch_x_end) - id(touch_x_start);
          int dy = id(touch_y_end) - id(touch_y_start);
          if (abs(dx) < 20 && abs(dy) < 20) {
            id(do_play_pause).execute();
          } else if (dx < -50 && abs(dx) > abs(dy) * 2) {
            id(do_next_track).execute();
          } else if (dx > 50 && abs(dx) > abs(dy) * 2) {
            id(do_prev_track).execute();
          }


# -----------------------------------------------------------------------------
# GLOBALS
# -----------------------------------------------------------------------------
globals:
  - id: ha_base_url
    type: std::string
    initial_value: '"http://homeassistant.local:8123"'
  - id: art_loaded
    type: bool
    initial_value: 'false'
  - id: last_art_url
    type: std::string
    initial_value: '""'
  - id: touch_x_start
    type: int
    initial_value: '0'
  - id: touch_y_start
    type: int
    initial_value: '0'
  - id: touch_x_end
    type: int
    initial_value: '0'
  - id: touch_y_end
    type: int
    initial_value: '0'


# -----------------------------------------------------------------------------
# HA SENSORS
# -----------------------------------------------------------------------------
text_sensor:
  - platform: homeassistant
    entity_id: ${media_entity}
    attribute: media_title
    id: media_title
    internal: true
    on_value:
      - lvgl.label.update:
          id: title_label
          text: !lambda 'return x.empty() ? std::string("\xe2\x80\x94") : x;'

  - platform: homeassistant
    entity_id: ${media_entity}
    attribute: media_artist
    id: media_artist
    internal: true
    on_value:
      - lambda: |-
          lv_label_set_text(id(artist_label), x.c_str());
          if (x.empty()) lv_obj_add_flag(id(artist_label), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(artist_label), LV_OBJ_FLAG_HIDDEN);

  - platform: homeassistant
    entity_id: ${media_entity}
    id: media_state
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return x == "playing";'
          then:
            - lvgl.widget.hide: play_icon
            - lvgl.widget.show: pause_icon
          else:
            - lvgl.widget.show: play_icon
            - lvgl.widget.hide: pause_icon

  - platform: homeassistant
    entity_id: ${media_entity}
    attribute: entity_picture
    id: media_picture
    internal: true
    on_value:
      then:
        - lambda: |-
            if (x.empty()) {
              id(art_loaded) = false;
              id(last_art_url) = "";
              return;
            }
            if (x == id(last_art_url)) return;
            id(last_art_url) = x;
            id(art_loaded) = false;
        - delay: 2s
        - lambda: |-
            std::string url = id(ha_base_url) + "/local/album_art.jpg";
            id(album_art).set_url(url.c_str());
            id(album_art).update();

sensor:
  - platform: homeassistant
    entity_id: ${media_entity}
    attribute: media_duration
    id: media_duration
    internal: true

  - platform: homeassistant
    entity_id: ${media_entity}
    attribute: media_position
    id: media_position
    internal: true


# -----------------------------------------------------------------------------
# SCRIPTS
# -----------------------------------------------------------------------------
script:
  - id: do_play_pause
    mode: single
    then:
      - homeassistant.service:
          service: media_player.media_play_pause
          data:
            entity_id: ${media_entity}
  - id: do_next_track
    mode: single
    then:
      - homeassistant.service:
          service: media_player.media_next_track
          data:
            entity_id: ${media_entity}
  - id: do_prev_track
    mode: single
    then:
      - homeassistant.service:
          service: media_player.media_previous_track
          data:
            entity_id: ${media_entity}

  - id: update_progress
    mode: restart
    then:
      - lambda: |-
          if (!id(media_duration).has_state() || !id(media_position).has_state()) return;
          float dur = id(media_duration).state;
          float pos = id(media_position).state;
          if (isnan(dur) || isnan(pos) || dur <= 0) return;
          int pct = (int)(pos / dur * 100.0f);
          if (pct < 0) pct = 0;
          if (pct > 100) pct = 100;
          lv_bar_set_value(id(progress_bar), pct, LV_ANIM_OFF);
          int pm = (int)pos / 60; int ps = (int)pos % 60;
          int dm = (int)dur / 60; int ds = (int)dur % 60;
          char buf[20];
          snprintf(buf, sizeof(buf), "%d:%02d / %d:%02d", pm, ps, dm, ds);
          lv_label_set_text(id(time_label), buf);

interval:
  - interval: 1s
    then:
      - script.execute: update_progress


# -----------------------------------------------------------------------------
# ALBUM ART
# -----------------------------------------------------------------------------
online_image:
  - url: "http://placeholder.invalid/placeholder.jpg"
    id: album_art
    format: jpeg
    type: RGB565
    update_interval: never
    on_download_finished:
      then:
        - lambda: |-
            id(art_loaded) = true;
            auto *w = id(art_widget);
            lv_obj_clear_flag(w, LV_OBJ_FLAG_HIDDEN);
            lv_obj_invalidate(w);
        - lvgl.image.update:
            id: art_widget
            src: album_art
    on_error:
      then:
        - lambda: 'id(art_loaded) = false;'


# -----------------------------------------------------------------------------
# FONTS
# -----------------------------------------------------------------------------
font:
  - file: "gfonts://Roboto@Light"
    id: title_font
    size: 28
    bpp: 4
    glyphs: >-
      !"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~ ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõöøùúûüýþÿŒœŠšŸŽž—–…°•€£¥¢

  - file: "gfonts://Roboto@Light"
    id: artist_font
    size: 18
    bpp: 4
    glyphs: >-
      !"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~ ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõöøùúûüýþÿŒœŠšŸŽž—–…°•€£¥¢

  - file: "gfonts://Roboto"
    id: time_font
    size: 14
    bpp: 4
    glyphs: " 0123456789:/-"

  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf'
    id: icon_font
    size: 28
    bpp: 4
    glyphs:
      - "\U000F040A"  # play
      - "\U000F03E4"  # pause


# -----------------------------------------------------------------------------
# LVGL — Minimal layout
# -----------------------------------------------------------------------------
lvgl:
  buffer_size: 10%

  pages:
    - id: main_page
      scrollbar_mode: "off"
      scrollable: false
      width: 100%
      height: 100%
      bg_color: 0x000000

      widgets:
        # Artwork (centered, hidden until loaded)
        - image:
            id: art_widget
            align: center
            src: album_art
            hidden: true

        # Dark overlay for text readability
        - obj:
            x: 0
            y: 0
            width: 320
            height: 240
            bg_color: 0x000000
            bg_opa: 60%
            radius: 0
            border_width: 0
            scrollable: false
            clickable: false

        # Track info
        - obj:
            x: 0
            y: 0
            width: 320
            height: 240
            bg_opa: 0%
            border_width: 0
            pad_left: 12
            pad_right: 12
            pad_top: 12
            pad_bottom: 10
            scrollable: false
            clickable: false
            layout:
              type: flex
              flex_flow: COLUMN
              pad_row: 0
            widgets:
              - label:
                  id: title_label
                  text: "—"
                  width: 100%
                  max_height: 150px
                  long_mode: wrap
                  text_font: title_font
                  text_color: 0xFFFFFF
                  text_line_space: 0
              - label:
                  id: artist_label
                  text: ""
                  pad_top: 4
                  width: 100%
                  long_mode: dot
                  text_font: artist_font
                  text_color: 0xFFFFFF
                  text_opa: 80%
                  hidden: true
              - label:
                  id: time_label
                  text: ""
                  pad_top: 8
                  width: 100%
                  text_font: time_font
                  text_color: 0xFFFFFF
                  text_opa: 70%

        # Play/pause button
        - button:
            align: bottom_right
            x: -10
            y: -14
            width: 48px
            height: 48px
            radius: 24
            bg_color: 0x313131
            shadow_width: 0
            widgets:
              - label:
                  id: play_icon
                  text_font: icon_font
                  align: center
                  text: "\U000F040A"
                  text_color: 0xFFFFFF
              - label:
                  id: pause_icon
                  text_font: icon_font
                  align: center
                  text: "\U000F03E4"
                  text_color: 0xFFFFFF
                  hidden: true
            on_press:
              - script.execute: do_play_pause

        # Progress bar
        - bar:
            id: progress_bar
            align: bottom_mid
            y: 0
            width: 320
            height: 3
            bg_color: 0x000000
            bg_opa: 50%
            radius: 0
            min_value: 0
            max_value: 100
            value: 0
            indicator:
              bg_color: 0xFFFFFF
              radius: 0
