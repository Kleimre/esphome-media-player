# =============================================================================
# LVGL MUSIC DASHBOARD — ESP32-2432S028 (320×240)
# =============================================================================
# Single-screen now-playing view scaled for the 2.8" 320×240 display.
# Artwork is 240×240 centered horizontally (40px margin each side).
# =============================================================================

lvgl:
  buffer_size: 10%
  rotation: ${display_rotation}
  on_boot:
    - lambda: |-
        lv_obj_clear_flag(id(speakers_container), LV_OBJ_FLAG_SCROLL_MOMENTUM);
        lv_obj_clear_flag(id(speakers_container), LV_OBJ_FLAG_SCROLL_ELASTIC);
        lv_obj_set_scroll_dir(id(speakers_container), LV_DIR_VER);
        lv_obj_set_style_pad_right(id(speakers_container), 0, LV_PART_SCROLLBAR);
        lv_obj_set_style_pad_top(id(speakers_container), 0, LV_PART_SCROLLBAR);
        lv_obj_set_style_pad_bottom(id(speakers_container), 0, LV_PART_SCROLLBAR);
        lv_indev_t *indev = lv_indev_get_next(NULL);
        #if ESPHOME_VERSION_CODE >= VERSION_CODE(2026, 4, 0)
        if (indev) lv_indev_set_scroll_limit(indev, 15);
        #else
        if (indev) indev->driver->scroll_limit = 15;
        #endif

  pages:
    - id: main_page
      scrollbar_mode: "off"
      scrollable: false
      width: 100%
      height: 100%
      bg_color: 0x000000
      pad_top: 0
      pad_bottom: 0
      pad_left: 0
      pad_right: 0

      widgets:
        # Colored backdrop behind artwork
        - obj:
            id: artwork_bg_panel
            x: 0
            y: 0
            width: 320px
            height: 240px
            bg_color: 0x000000
            bg_opa: 100%
            radius: 0
            border_width: 0
            pad_all: 0
            scrollable: false

        # Album artwork background (240×240, left-aligned; music.yaml repositions dynamically)
        - image:
            id: album_art_background_widget
            x: 0
            y: 0
            width: 240px
            height: 240px
            src: album_art_background
            opa: 100%

        # Error label: shown when album art download fails
        - label:
            id: artwork_error_label
            text: "Artwork unavailable"
            align: center
            y: -20
            width: 200px
            height: 20px
            text_font: roboto12_font
            text_color: 0x888888
            text_align: center
            hidden: true

        # Darkening layer over artwork
        - obj:
            id: accent_overlay
            x: 0
            y: 0
            width: 320
            height: 240
            bg_color: 0x000000
            bg_opa: 80%
            opa: 80%
            radius: 0
            border_width: 0
            pad_all: 0
            scrollable: false
            scrollbar_mode: "off"
            clickable: false

        # Track info text
        - obj:
            id: track_info_text
            x: 0
            y: 0
            width: 320
            height: 240
            bg_opa: 0%
            radius: 0
            border_width: 0
            pad_left: 10
            pad_right: 10
            pad_top: 10
            pad_bottom: 8
            scrollable: false
            scrollbar_mode: "off"
            clickable: false
            layout:
              type: flex
              flex_flow: COLUMN
              pad_row: 0
            widgets:
              - label:
                  id: media_title_label
                  text: "—"
                  width: 100%
                  max_height: 140px
                  long_mode: wrap
                  text_font: roboto_light28_font
                  text_color: 0xFFFFFF
                  text_align: left
                  text_line_space: 0
              - label:
                  id: media_artist_label
                  text: ""
                  pad_top: 3
                  width: 100%
                  long_mode: dot
                  text_font: roboto_light18_font
                  text_color: 0xFFFFFF
                  text_opa: 80%
                  text_align: left
                  hidden: true
              - label:
                  id: media_time_label
                  text: "0:00  /  0:00"
                  pad_top: 6
                  width: 100%
                  text_font: roboto12_font
                  text_color: 0xFFFFFF
                  text_opa: 80%
                  text_align: left
                  on_click:
                    - switch.toggle: show_remaining_time

        # Play/pause: 48px round, bottom-right corner
        - button:
            id: media_play_pause_button
            align: bottom_right
            x: -10
            y: -14
            width: 48px
            height: 48px
            styles: control_round
            widgets:
              - label:
                  id: media_play_icon
                  text_font: icon_font_large
                  align: center
                  text: $play
                  text_color: 0xFFFFFF
                  hidden: false
              - label:
                  id: media_pause_icon
                  text_font: icon_font_large
                  align: center
                  text: $pause
                  text_color: 0xFFFFFF
                  hidden: true
            on_press:
              - homeassistant.service:
                  service: media_player.media_play_pause
                  variables:
                    target: !lambda |-
                      return id(is_tv_mode) ? id(linked_media_player_entity).state : id(media_player_entity).state;
                  data_template:
                    entity_id: "{{ target }}"
                  on_error:
                    - lambda: |-
                        if (!id(actions_prompt_acked) && !id(device_has_been_setup)) {
                          lv_obj_clear_flag(id(actions_prompt), LV_OBJ_FLAG_HIDDEN);
                        }
              - logger.log: "Media: play_pause"

        # Progress bar: full screen width, bottom
        - bar:
            id: media_progress_bar
            align: bottom_mid
            y: 0
            width: 320
            height: 3
            bg_color: 0x000000
            bg_opa: 50%
            radius: 0
            min_value: 0
            max_value: 100
            value: 0
            indicator:
              bg_color: 0xFFFFFF
              radius: 0

        - !include ../setup/setup_prompt.yaml
        - !include ../setup/actions_prompt.yaml

        # ---------------------------------------------------------------
        # SETTINGS PANEL (swipe-down from top)
        # ---------------------------------------------------------------
        - obj:
            id: settings_panel
            x: 0
            y: 0
            width: 320
            height: 240
            bg_color: 0x000000
            bg_opa: 100%
            radius: 0
            border_width: 0
            pad_all: 0
            scrollable: false
            scrollbar_mode: "off"
            hidden: true
            widgets:
              # Volume arc dial (single-speaker mode)
              - arc:
                  id: volume_arc
                  align: center
                  y: 10
                  width: 180
                  height: 180
                  min_value: 0
                  max_value: 100
                  value: 30
                  adjustable: true
                  arc_color: 0x333333
                  arc_width: 12
                  arc_rounded: true
                  hidden: true
                  indicator:
                    arc_color: 0x999999
                    arc_width: 12
                    arc_rounded: true
                  knob:
                    bg_color: 0xFFFFFF
                    radius: 10
                    width: 20
                    height: 20
                    border_width: 0
                  on_value:
                    - lvgl.label.update:
                        id: volume_pct_label
                        text: !lambda |-
                          char buf[8];
                          snprintf(buf, sizeof(buf), "%d%%", (int)x);
                          return std::string(buf);
                    - if:
                        condition:
                          lambda: 'return !id(volume_updating_from_ha);'
                        then:
                          - lambda: |-
                              id(volume_pending_pct) = (int)(x + 0.5f);
                              id(volume_pending_until) = millis() + 1500;
                          - homeassistant.service:
                              service: media_player.volume_set
                              variables:
                                target: !lambda 'return id(media_player_entity).state;'
                                vol_level: !lambda 'return x / 100.0f;'
                              data_template:
                                entity_id: "{{ target }}"
                                volume_level: "{{ vol_level }}"
              - label:
                  id: volume_title_label
                  text: "Volume"
                  text_font: roboto12_font
                  text_color: 0x888888
                  align: center
                  y: -15
                  width: 80
                  height: 16
                  text_align: center
                  hidden: true
              - label:
                  id: volume_pct_label
                  text: "30%"
                  text_font: roboto28_font
                  text_color: 0xFFFFFF
                  align: center
                  y: 10
                  width: 100
                  height: 32
                  text_align: center
                  hidden: true
              - button:
                  id: volume_down_button
                  align: center
                  x: -30
                  y: 85
                  width: 40px
                  height: 40px
                  styles: control_round
                  hidden: true
                  widgets:
                    - label:
                        text_font: $icon_font
                        align: center
                        text: $icon_minus
                        text_color: 0xFFFFFF
                  on_press:
                    - lvgl.arc.update:
                        id: volume_arc
                        value: !lambda |-
                          int v = lv_arc_get_value(id(volume_arc)) - 1;
                          if (v < 0) v = 0;
                          return v;
              - button:
                  id: volume_up_button
                  align: center
                  x: 30
                  y: 85
                  width: 40px
                  height: 40px
                  styles: control_round
                  hidden: true
                  widgets:
                    - label:
                        text_font: $icon_font
                        align: center
                        text: $icon_plus
                        text_color: 0xFFFFFF
                  on_press:
                    - lvgl.arc.update:
                        id: volume_arc
                        value: !lambda |-
                          int v = lv_arc_get_value(id(volume_arc)) + 1;
                          if (v > 100) v = 100;
                          return v;

              # Title
              - label:
                  id: speakers_title_label
                  text: "Speakers"
                  text_font: roboto_light24_font
                  text_color: 0xFFFFFF
                  x: 10
                  y: 8
                  width: 260
                  text_align: left
                  hidden: true

              # Speaker card grid (2-across, compact)
              - obj:
                  id: speakers_container
                  x: 0
                  y: 0
                  width: 100%
                  height: 100%
                  bg_opa: 0%
                  border_width: 0
                  pad_left: 10
                  pad_right: 10
                  pad_top: 10
                  pad_bottom: 8
                  scrollable: true
                  scrollbar_mode: auto
