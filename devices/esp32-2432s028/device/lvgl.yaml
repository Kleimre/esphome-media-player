                                    radius: 0
                                    bg_opa: 0%
                                    border_width: 0
                                    shadow_width: 0
                                    pad_all: 0
                                    on_click:
                                      - script.execute: group_volume_down
                                    widgets:
                                      - label:
                                          text: "${icon_minus}"
                                          text_font: icon_font_small
                                          text_color: 0xFFFFFF
                                          align: center
                                - obj:
